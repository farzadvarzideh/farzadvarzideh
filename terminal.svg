
<svg xmlns="http://www.w3.org/2000/svg"
     width="920" height="514"
     viewBox="0 0 920 514">

  <!-- Terminal background -->
  <rect width="920" height="514"
        rx="14" fill="#0D1117"/>

  <rect x="1" y="1"
        width="918" height="512"
        rx="13"
        fill="none"
        stroke="#25364A"/>

  <!-- macOS window controls -->
  <circle cx="24" cy="26" r="6" fill="#FF5F57"/>
  <circle cx="45" cy="26" r="6" fill="#FEBC2E"/>
  <circle cx="66" cy="26" r="6" fill="#28C840"/>

  <!-- Terminal title -->
  <text x="700" y="31"
        fill="#A8B6C8"
        font-size="13"
        font-family="DejaVu Sans Mono, Consolas, monospace">
    farzad@arch: ~
  </text>

  <!-- Header separator -->
  <path d="M 20 48 H 900" stroke="#25364A"/>

  <!-- Command: whoami -->
  <text x="28" y="80"
        font-size="15"
        font-family="DejaVu Sans Mono, Consolas, monospace">
    <tspan fill="#3FB950">farzad@arch:~$</tspan><tspan dx="9" fill="#FFFFFF">whoami</tspan>
  </text>

  <!-- Output: whoami -->
  <text x="28" y="110"
        fill="#FFFFFF"
        font-size="15"
        font-family="DejaVu Sans Mono, Consolas, monospace">
    Farzad Varzideh
  </text>

  <!-- Command: cat mission.txt -->
  <text x="28" y="170"
        font-size="15"
        font-family="DejaVu Sans Mono, Consolas, monospace">
    <tspan fill="#3FB950">farzad@arch:~$</tspan><tspan dx="9" fill="#FFFFFF">cat mission.txt</tspan>
  </text>

  <!-- Mission output -->
  <g fill="#FFFFFF"
     font-size="15"
     font-family="DejaVu Sans Mono, Consolas, monospace">

    <text x="28" y="200">
      &gt; Build beyond functionality. Understand what lies beneath.
    </text>

    <text x="28" y="230">
      &gt; Explore systems from architecture to their weakest points.
    </text>

    <text x="28" y="260">
      &gt; Write code with an engineer's precision.
    </text>

    <text x="28" y="290">
      &gt; Analyze it with an attacker's mindset.
    </text>

    <text x="28" y="320">
      &gt; Turn curiosity into knowledge, and knowledge into capability.
    </text>

    <text x="28" y="350">
      &gt;
    </text>

    <text x="28" y="380">
      &gt; Primary objective: Red Team Operations.
    </text>

  </g>

  <!-- Command: ls ./roadmap -->
  <text x="28" y="440"
        font-size="15"
        font-family="DejaVu Sans Mono, Consolas, monospace">
    <tspan fill="#3FB950">farzad@arch:~$</tspan><tspan dx="9" fill="#FFFFFF">ls ./roadmap</tspan>
  </text>

  <!-- Directory output -->
  <text x="28" y="470"
        fill="#58A6FF"
        font-size="15"
        font-family="DejaVu Sans Mono, Consolas, monospace">
    backend/   systems/   offensive-security/
  </text>

</svg>
